<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shop — D2D Dawn Till Dark</title>
  <meta name="description" content="Shop D2D hoodies, t-shirts and pants." />
  <meta name="theme-color" content="#0a0a0b" />
  <link rel="icon" href="assets/favicon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800;1,900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="shop">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="nav">
    <a href="index.html" class="nav__logo" aria-label="D2D Dawn Till Dark, home">
      <img src="assets/d2d-mark.png" alt="" width="124" height="25" />
    </a>
    <button class="nav__toggle" type="button" aria-expanded="false" aria-controls="menu" aria-label="Menu"><span></span><span></span></button>
    <nav class="nav__menu" id="menu" aria-label="Primary">
      <ul class="nav__links">
        <li><a href="shop.html" data-page="shop">Shop all</a></li>
        <li><a href="shop.html?type=hoodie">Hoodies</a></li>
        <li><a href="shop.html?type=tee">T-shirts</a></li>
        <li><a href="shop.html?type=pants">Pants</a></li>
      </ul>
    </nav>
  </header>

  <main id="main" class="page">
    <section class="container">
      <div class="page__head">
        <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span aria-hidden="true">/</span><span id="crumb-current">Shop all</span></nav>
        <h1 id="shop-title" class="page__title">Shop all</h1>
        <p class="page__sub" id="shop-sub">Every piece in Collection 01.</p>
      </div>
      <div class="toolbar">
        <div class="filters" role="group" aria-label="Filter by category">
          <button type="button" class="chip" data-type="all">All <span></span></button>
          <button type="button" class="chip" data-type="hoodie">Hoodies <span></span></button>
          <button type="button" class="chip" data-type="tee">T-shirts <span></span></button>
          <button type="button" class="chip" data-type="pants">Pants <span></span></button>
        </div>
        <label class="sort">
          <span>Sort</span>
          <select id="sort">
            <option value="featured">Featured</option>
            <option value="price-asc">Price: low to high</option>
            <option value="price-desc">Price: high to low</option>
            <option value="name">Name</option>
          </select>
        </label>
      </div>
      <p class="sr-only" id="result-count" role="status" aria-live="polite"></p>
      <div class="grid grid--shop" id="grid"></div>
    </section>
  </main>
  <footer class="footer">
    <div class="container footer__grid">
      <div>
        <a href="index.html" class="footer__logo" aria-label="D2D Dawn Till Dark, home"><img src="designs/d2d-logo-white.png" alt="" width="180" height="52" /></a>
        <p class="footer__note">Training wear for early starts and late finishes. Online checkout opening soon.</p>
      </div>
      <nav aria-label="Footer">
        <h3>Shop</h3>
        <ul>
          <li><a href="shop.html?type=hoodie">Hoodies</a></li>
          <li><a href="shop.html?type=tee">T-shirts</a></li>
          <li><a href="shop.html?type=pants">Pants</a></li>
        </ul>
      </nav>
      <p class="footer__copy">© <span id="year"></span> D2D — Dawn Till Dark</p>
    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="js/products.js"></script>
  <script src="js/mockups.js"></script>
  <script src="js/app.js"></script>
  <script src="js/shop.js"></script>
</body>
</html>
